# Build cost probe — measure what a GeckoView build actually costs on a
# GitHub-hosted runner, instead of guessing from generic Firefox-build priors.
#
# Manual dispatch ONLY. This burns real Actions minutes (this repo is private, so
# every minute is billed against the account's monthly allowance and then at the
# standard Linux rate), and a from-scratch Gecko build is measured in hours — it
# must never fire automatically on push.
#
# WHY a single ABI: the probe answers "what does one clean compile cost here?".
# Phase 1 is per-ABI and linear, so one ABI plus the reported phase split
# extrapolates to the real two-ABI build without paying for it twice.
#
# THE DISK PROBLEM: a hosted runner guarantees only ~14 GB free on /, and this
# build needs ~40 GB (source ~5 GB + ~/.mozbuild toolchain 10-15 GB + one objdir
# 20-30 GB). /mnt is NOT reliably the answer: its size follows the VM SKU, and on
# the 2-core standard runner a private personal repo gets, it is small enough that
# `mach bootstrap` alone exhausted it (run 33071269712 died unzipping the Android
# emulator's system.img with "No space left on device").
#
# So: delete the preinstalled toolchains nobody here uses (~25-35 GB of .NET, GHC,
# CodeQL, Android SDK, Docker images), then put the scratch on whichever of / and
# /mnt actually has the most room afterwards, decided at runtime and exported via
# GITHUB_ENV. Note that bootstrap provisions a full *development* environment —
# emulator plus an x86_64 system image, 10+ GB a build-only job never runs — which
# is a large part of what has to fit.
#
# THE TOOLCHAIN TRAP: hosted runners preset ANDROID_HOME / ANDROID_SDK_ROOT /
# ANDROID_NDK_HOME to their own preinstalled SDK+NDK. config/build.env honours
# those, which would silently flip the build onto the reuse-existing-SDK path
# (skipping `mach bootstrap`) with an NDK version Firefox does not pin — a
# guaranteed configure failure. So every stage runs through scripts/ci-clean-env,
# which UNSETS them.
#
# They must be unset, NOT set to "": our shell scripts read them as ${VAR:-} so
# empty behaves like absent, but mach does not. mozboot/android.py resolves the
# NDK with os.environ.get("ANDROID_NDK_HOME", <bootstrap default>), and an empty
# string is still *present*, so it wins over the default — the path becomes ""
# and bootstrap dies on `FileNotFoundError: 'source.properties'` (observed in run
# 33070704928). GitHub's `env:` block cannot express "unset", hence the wrapper.
name: Build cost probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rust target triple to build (one ABI keeps the probe bounded)"
        type: choice
        default: aarch64-linux-android
        options:
          - aarch64-linux-android
          - x86_64-linux-android
      jobs:
        description: "mach -jN (blank = runner core count)"
        type: string
        default: ""
      upload_aar:
        description: "Upload the built AAR as a run artifact (~165 MB against storage)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # GitHub hard-caps a job at 6h; stop just under so the summary step still runs
    # and we learn how far it got rather than getting killed mid-compile.
    timeout-minutes: 350

    # GECKO_SRC / MOZBUILD_STATE_PATH / CARGO_HOME / RUSTUP_HOME are deliberately
    # NOT set here: the scratch location is chosen at runtime (see "Reclaim disk")
    # and exported through GITHUB_ENV, and a job-level env entry would shadow it.
    env:
      ANDROID_TARGETS: ${{ inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Runner facts
        run: |
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          {
            echo "### Runner"
            echo '```'
            echo "cores    : $(nproc)"
            echo "model    : $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory   : $(free -g | awk '/^Mem:/{print $2" GB"}')"
            echo "glibc    : $(ldd --version | head -1)"
            echo "os       : $(. /etc/os-release; echo "$PRETTY_NAME")"
            df -h / /mnt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reclaim disk and pick scratch
        run: |
          # Everything below is preinstalled tooling this build never touches.
          # Deleting it is the only way to get a Gecko-sized objdir onto a hosted
          # runner; each path is guarded so a missing one is not an error.
          before_root=$(df --output=avail -k / | tail -1)
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          after_root=$(df --output=avail -k / | tail -1)

          # Pick the roomier filesystem rather than assuming /mnt is big — its
          # size tracks the VM SKU (see header).
          avail_mnt=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${avail_mnt:-0}" -gt "$after_root" ]; then
            SCRATCH=/mnt/build
          else
            SCRATCH=/scratch
          fi
          sudo mkdir -p "$SCRATCH"/{gecko,mozbuild}
          sudo chown -R "$USER" "$SCRATCH"

          # CARGO_HOME / RUSTUP_HOME are deliberately left alone. Pointing
          # RUSTUP_HOME at a fresh empty dir while `rustup` still resolves to the
          # runner's preinstalled /home/runner/.cargo/bin/rustup leaves it with no
          # toolchains — bootstrap's `rustup component add rustfmt` then dies with
          # "could not choose a version of rustup to run ... no default is
          # configured" (run 33071914682). The runner's Rust install is already
          # correct, and cargo's build output lands in the objdir under GECKO_SRC
          # regardless; only the registry cache stays on /.
          {
            echo "GECKO_SRC=$SCRATCH/gecko"
            echo "MOZBUILD_STATE_PATH=$SCRATCH/mozbuild"
          } >> "$GITHUB_ENV"

          # -jN: the local default (16) would thrash a 2-core runner.
          JOBS="${{ inputs.jobs }}"
          [ -n "$JOBS" ] || JOBS="$(nproc)"
          echo "BUILD_JOBS=$JOBS" >> "$GITHUB_ENV"
          : > /tmp/timings

          # Echo to the log as well as the summary — a previous run put the disk
          # figures only in the summary, which is exactly what you cannot read
          # while diagnosing a failed step.
          {
            echo "### Disk after reclaim"
            echo '```'
            printf 'freed on / : %s GB\n' "$(( (after_root - before_root) / 1024 / 1024 ))"
            printf 'scratch    : %s\n' "$SCRATCH"
            df -h / /mnt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Each stage is timed separately: the phase split (setup vs compile) is the
      # actual finding here, because hosted runs can never cache the setup —
      # actions/cache tops out at 10 GB, well under ~/.mozbuild alone.
      - name: Stage 01 — fetch source
        run: |
          t=$(date +%s); scripts/ci-clean-env ./build.sh fetch; echo "fetch $(( $(date +%s) - t ))" >> /tmp/timings

      - name: Stage 02 — bootstrap toolchain
        run: |
          t=$(date +%s); scripts/ci-clean-env ./build.sh bootstrap; echo "bootstrap $(( $(date +%s) - t ))" >> /tmp/timings

      # Bootstrap provisions a full development environment; the emulator, its
      # system images and the generated AVD are only for RUNNING tests on a
      # device, which this job never does. They are ~8-10 GB, and the objdir this
      # runner still has to fit is 20-30 GB — so reclaim them before compiling.
      - name: Trim bootstrap extras
        run: |
          rm -rf \
            "$MOZBUILD_STATE_PATH/android-sdk-linux/emulator" \
            "$MOZBUILD_STATE_PATH/android-sdk-linux/system-images" \
            "$MOZBUILD_STATE_PATH/android-device" 2>/dev/null || true
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage 03 — apply patches
        run: |
          t=$(date +%s); scripts/ci-clean-env ./build.sh patch; echo "patch $(( $(date +%s) - t ))" >> /tmp/timings

      - name: Stage 04 — build + publish
        run: |
          t=$(date +%s); scripts/ci-clean-env ./build.sh build; echo "build $(( $(date +%s) - t ))" >> /tmp/timings

      - name: Disk footprint
        if: always()
        run: |
          {
            echo "### Disk"
            echo '```'
            df -h / /mnt
            du -sh "$GECKO_SRC" "$MOZBUILD_STATE_PATH" 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cost summary
        if: always()
        run: |
          TOTAL=$(( $(date +%s) - JOB_T0 ))
          # GitHub rounds each job up to the whole minute.
          MINS=$(( (TOTAL + 59) / 60 ))
          # Full two-ABI estimate = this run + one more compile. Setup (fetch,
          # bootstrap, patch) is paid once; only phase 1 repeats per ABI. The
          # measured `build` already includes the fat repackage + publish, so this
          # slightly OVER-counts — fine for a ceiling.
          BUILD_SECS=$(awk '$1=="build"{print $2}' /tmp/timings)
          [ -n "$BUILD_SECS" ] || BUILD_SECS=0
          FULL_MINS=$(( (TOTAL + BUILD_SECS + 59) / 60 ))
          {
            echo "### Timing"
            echo "| phase | duration |"
            echo "|---|---|"
            while read -r name secs; do
              printf '| %s | %dm %02ds |\n' "$name" "$((secs / 60))" "$((secs % 60))"
            done < /tmp/timings
            printf '| **job total** | **%dm %02ds** |\n' "$((TOTAL / 60))" "$((TOTAL % 60))"
            echo
            echo "### Cost — one ABI billed at $MINS min; full build est. $FULL_MINS min"
            echo "| runner | rate/min | this probe | est. full build (2 ABIs + fat) |"
            echo "|---|---|---|---|"
            awk -v mins="$MINS" -v full="$FULL_MINS" '
              BEGIN {
                n = split("standard-linux:0.006,larger-16vcpu:0.042,larger-32vcpu:0.082", r, ",")
                for (i = 1; i <= n; i++) {
                  split(r[i], kv, ":")
                  printf "| %s | $%.3f | $%.2f | $%.2f |\n", kv[1], kv[2], mins*kv[2], full*kv[2]
                }
              }'
            echo
            echo "_Larger-runner rows are list-rate arithmetic only — they need a Team/Enterprise plan, and their vCPUs are hyperthreads, so wall-clock would differ._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate built AAR
        if: always()
        run: |
          find "$HOME/.m2/repository/org/mozilla/geckoview" -name '*.aar' -exec ls -lh {} + 2>/dev/null || \
            echo "no AAR published (build did not reach the publish step)"

      - name: Upload AAR
        if: ${{ inputs.upload_aar && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: geckoview-${{ inputs.target }}
          path: /home/runner/.m2/repository/org/mozilla/geckoview/**/*.aar
          retention-days: 3
